<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statement Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #1e293b;
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    button, input, select { font: inherit; }
    .topbar {
      flex: none;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: #1e3a5f;
      color: white;
    }
    .topbar-title { font-size: .95rem; font-weight: 600; letter-spacing: .01em; }
    .tab-bar { display: flex; gap: 4px; margin-left: 28px; }
    .tab-btn { padding: 6px 14px; border: 0; border-radius: 6px; background: transparent; color: rgba(255,255,255,.75); cursor: pointer; font-size: .82rem; font-weight: 600; }
    .tab-btn:hover { background: rgba(255,255,255,.1); color: white; }
    .tab-btn.active { background: rgba(255,255,255,.16); color: white; }
    .panel { display: flex; flex: 1; flex-direction: column; min-height: 0; }
    .toolbar {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 24px;
      border-bottom: 1px solid #e2e8f0;
      background: white;
    }
    .toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .toolbar-label {
      color: #64748b;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .search-input {
      width: 285px;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      outline: none;
      font-size: .875rem;
    }
    .search-input:focus { border-color: #2563eb; }
    .search-input:disabled { color: #94a3b8; background: #f8fafc; }
    select.search-input { width: auto; min-width: 195px; }
    select.compact-select { min-width: 135px; }
    #loadStatus { color: #64748b; font-size: .78rem; }
    .count-label { margin-left: auto; color: #94a3b8; font-size: .78rem; }
    .filters-disclosure { margin-top: 2px; }
    .filters-summary {
      display: inline-flex;
      align-items: center;
      margin: 2px 0;
      color: #2563eb;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .filters-summary::-webkit-details-marker { display: none; }
    .filters-summary::before { content: '▸'; display: inline-block; width: 1.1em; }
    .filters-disclosure[open] > .filters-summary::before { content: '▾'; }
    .filters-summary:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .filters-badge {
      margin-left: 7px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      font-size: .68rem;
      font-weight: 700;
    }
    .filters-disclosure[open] #filterRow { margin-top: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .table-caption { padding: 9px 24px; color: #64748b; font-size: .8rem; line-height: 1.45; }
    .caption-legend { display: inline-flex; align-items: center; gap: 5px; margin-right: 14px; color: #334155; font-weight: 600; }
    .legend-swatch { width: 14px; height: 5px; margin-left: 5px; border-radius: 3px; }
    .legend-swatch.generator { background: #173f78; }
    .legend-swatch.judge { background: #0f766e; }
    .table-wrap { flex: 1; overflow: auto; padding: 0 24px; }
    table { width: 100%; min-width: 1120px; max-width: 1800px; margin: 0 auto; border-collapse: collapse; table-layout: fixed; }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 2px solid #e2e8f0;
      background: white;
    }
    th.col-num, td.col-num { width: 42px; padding: 0 10px 0 0; text-align: right; }
    th.col-num, th.col-stmt, th.col-meta {
      padding-bottom: 9px;
      color: #64748b;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      vertical-align: bottom;
    }
    td.col-num { color: #94a3b8; font-size: .78rem; font-variant-numeric: tabular-nums; }
    th.col-stmt { width: 28%; padding-right: 14px; text-align: left; }
    th.col-meta, td.col-meta { width: 86px; padding: 8px; text-align: center; vertical-align: middle; }
    .meta-sub { display: block; margin-top: 2px; color: #64748b; font-size: .64rem; font-weight: 400; }
    th.col-feat { padding: 10px 4px; text-align: center; vertical-align: top; overflow-wrap: anywhere; }
    th.col-feat.filter-v1 { background: #eff6ff; }
    th.col-feat.filter-v0 { background: #f1f5f9; }
    .th-label { display: flex; height: 3.75em; flex-direction: column; justify-content: flex-end; color: #475569; font-size: .76rem; font-weight: 700; line-height: 1.25; }
    .th-label > span { display: block; white-space: nowrap; }
    .feature-options { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .feature-option-row { position: relative; display: flex; min-height: 27px; align-items: stretch; }
    .feature-option {
      flex: 1;
      min-width: 0;
      min-height: 27px;
      padding: 4px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background: white;
      color: #475569;
      cursor: pointer;
      font-size: .69rem;
    }
    .feature-option-row:has(.th-help-btn) .feature-option { padding-right: 27px; }
    .feature-option[aria-pressed="true"] { border-color: #1e3a5f; background: #1e3a5f; color: white; }
    .feature-option:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .th-help-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      width: 16px;
      height: 16px;
      padding: 0;
      transform: translateY(-50%);
      border: 1px solid currentColor;
      border-radius: 50%;
      background: transparent;
      color: #64748b;
      cursor: help;
      font-size: .65rem;
      line-height: 1;
    }
    .feature-option[aria-pressed="true"] + .th-help-btn { color: white; }

    tbody tr { border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eff6ff; }
    td.col-stmt { padding: 12px 14px 12px 0; font-size: .86rem; line-height: 1.45; }
    .statement-button {
      display: -webkit-box;
      width: 100%;
      height: 2.9em;
      overflow: hidden;
      padding: 0;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      line-height: 1.45;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .statement-button:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
    td.col-feat { padding: 8px; text-align: center; vertical-align: middle; }
    tbody td.col-alt { background: rgba(100, 116, 139, .025); }
    tbody tr:nth-child(even) td.col-alt { background: rgba(100, 116, 139, .06); }
    tbody tr:hover td { background: transparent; }
    .feat-cell { display: flex; min-height: 30px; flex-direction: column; justify-content: center; gap: 4px; font-size: .68rem; line-height: 1.25; }
    .assessment-line { display: grid; grid-template-columns: 32px minmax(0, 1fr) 42px; align-items: center; gap: 3px; }
    .assessment-role { color: #64748b; font-size: .58rem; font-weight: 700; text-align: left; text-transform: uppercase; }
    .assessment-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .confidence-value { display: block; width: 42px; height: 6px; overflow: hidden; border-radius: 3px; background: #e2e8f0; cursor: help; }
    .confidence-fill { display: block; height: 100%; border-radius: inherit; pointer-events: none; }
    .confidence-fill.generator { background: #173f78; }
    .confidence-fill.judge { background: #0f766e; }
    .feat-verdict { display: flex; align-items: baseline; justify-content: center; gap: 5px; font-size: .74rem; font-weight: 600; color: #334155; }
    .feat-icon { flex: none; font-size: .82rem; font-weight: 700; }
    .feat-verdict--agree .feat-icon { color: #166534; }
    .feat-verdict--disagree .feat-icon { color: #9f1239; }
    .feat-verdict--pending .feat-icon, .feat-verdict--pending .feat-value { color: #94a3b8; }
    .feat-value { overflow-wrap: anywhere; }
    .feat-pair-heading { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: 10px; font-size: .74rem; font-weight: 600; }
    .feat-pair-label { min-width: 0; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .feat-pair-label--gen { color: #173f78; }
    .feat-pair-label--judge { color: #0f766e; }
    .feat-icon--disagree { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: .68rem; color: #9f1239; }
    .feat-bars { display: flex; gap: 10px; }
    .feat-bars .confidence-value { flex: 1; width: auto; }
    .agreement-label { font-size: .62rem; font-weight: 700; }
    .agree { color: #166534; }
    .disagree { color: #9f1239; }
    .pending-label { color: #94a3b8; }
    .status-chip { display: inline-block; padding: 3px 7px; border-radius: 999px; font-size: .68rem; font-weight: 700; }
    .judge-result .meta-sub { margin-top: 5px; }
    .status-chip.yes { color: #166534; background: #dcfce7; }
    .status-chip.no { color: #9f1239; background: #ffe4e6; }
    .status-chip.neutral { color: #475569; background: #e2e8f0; }
    .empty-row td { padding: 40px; color: #94a3b8; font-size: .9rem; text-align: center; }

    .pagination-bar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      border-top: 1px solid #e2e8f0;
      background: white;
      color: #64748b;
      font-size: .82rem;
    }
    .page-btn { padding: 4px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; color: #1e293b; cursor: pointer; font-size: .82rem; }
    .page-btn:disabled { opacity: .4; cursor: default; }

    .summary-panel { flex: 1; overflow: auto; padding: 22px 24px 32px; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(160px, 1fr)); gap: 12px; max-width: 900px; margin: 0 auto 26px; }
    .summary-card { padding: 16px; border-radius: 9px; background: #f8fafc; }
    .summary-card span, .summary-card small { display: block; color: #64748b; font-size: .74rem; }
    .summary-card strong { display: block; margin: 5px 0 2px; font-size: 1.35rem; }
    .agreement-summary { max-width: 900px; margin: 0 auto; }
    .agreement-summary h2 { margin-bottom: 14px; font-size: 1rem; }
    .summary-feature { display: grid; grid-template-columns: 180px 1fr 48px; align-items: center; gap: 10px; margin: 12px 0; font-size: .82rem; }
    .summary-track { height: 8px; overflow: hidden; border-radius: 4px; background: #e2e8f0; }
    .summary-fill { height: 100%; border-radius: inherit; background: #173f78; }
    .summary-empty { max-width: 700px; margin: 40px auto; color: #64748b; text-align: center; }

    #statementDialog {
      width: min(900px, calc(100vw - 32px));
      max-height: 86vh;
      margin: auto;
      overflow-y: auto;
      padding: 24px;
      border: 0;
      border-radius: 12px;
      color: #1e293b;
      box-shadow: 0 20px 60px #0004;
    }
    #statementDialog::backdrop { background: #0f172a99; }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .dialog-header h2 { font-size: 1.1rem; }
    #statementText { margin-bottom: 8px; font-size: 1.15rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    #statementModel { margin-bottom: 20px; color: #64748b; font-size: .85rem; }
    .statement-feature { padding: 14px 0; border-top: 1px solid #e2e8f0; }
    .statement-feature h3 { margin-bottom: 7px; font-size: .9rem; }
    .statement-feature p { line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .feature-confidence { margin-bottom: 5px; color: #64748b; font-size: .8rem; }
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .comparison-grid.single { grid-template-columns: 1fr; }
    .assessment-panel { padding: 11px; border-radius: 8px; background: #f8fafc; border-left: 4px solid transparent; }
    .assessment-panel h4 { margin-bottom: 6px; color: #64748b; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; }
    .assessment-panel strong { display: block; margin-bottom: 4px; }
    .assessment-panel--generator { background: #eff6ff; border-left-color: #173f78; }
    .assessment-panel--generator h4 { color: #173f78; }
    .assessment-panel--judge { background: #f0fdfa; border-left-color: #0f766e; }
    .assessment-panel--judge h4 { color: #0f766e; }
    .agreement-badge { margin-left: 8px; font-size: .68rem; }

    #featPopup, #dotTooltip {
      display: none;
      position: fixed;
      z-index: 9999;
      border-radius: 9px;
      box-shadow: 0 4px 20px #0003;
    }
    #featPopup.visible, #dotTooltip.visible { display: block; }
    #featPopup { width: 320px; padding: 14px 16px; border: 1px solid #e2e8f0; background: white; }
    .popup-label { margin-bottom: 4px; font-size: .82rem; font-weight: 700; }
    .popup-def { color: #475569; font-size: .8rem; line-height: 1.5; }
    #dotTooltip { width: 260px; padding: 10px 12px; background: #1e293b; color: white; pointer-events: none; font-size: .78rem; line-height: 1.5; }
    .dt-header { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .dt-label { color: #93c5fd; font-size: .8rem; font-weight: 700; }
    .dt-confidence { margin-left: auto; color: #cbd5e1; font-size: .72rem; white-space: nowrap; }
    .dt-explanation { color: #e2e8f0; }
    [hidden] { display: none !important; }
    @media (max-width: 850px) {
      .comparison-grid, .summary-grid { grid-template-columns: 1fr; }
      .table-wrap { padding: 0 10px; }
      .summary-feature { grid-template-columns: 135px 1fr 45px; }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <span class="topbar-title">Statement Explorer</span>
    <div class="tab-bar" role="tablist">
      <button type="button" class="tab-btn active" data-panel="explorer" role="tab" aria-selected="true">Statements</button>
    </div>
  </nav>

  <div id="panelExplorer" class="panel">
  <div class="toolbar">
    <div class="toolbar-row">
      <label class="toolbar-label" for="modelSelect">Generator</label>
      <select id="modelSelect" class="search-input" disabled></select>
      <label class="toolbar-label" for="judgeSelect">Judge</label>
      <select id="judgeSelect" class="search-input" disabled></select>
      <label class="toolbar-label" for="viewMode">View</label>
      <select id="viewMode" class="search-input compact-select">
        <option value="compare">Compare</option>
        <option value="generated">Generated</option>
        <option value="judged">Judged</option>
      </select>
      <label class="toolbar-label" for="displayMode">Display</label>
      <select id="displayMode" class="search-input compact-select">
        <option value="statements">Statements</option>
        <option value="summary">Summary</option>
      </select>
      <span id="loadStatus" role="status" aria-live="polite"></span>
    </div>
    <details id="filtersDetails" class="filters-disclosure">
      <summary class="filters-summary">Search &amp; filters<span id="filtersBadge" class="filters-badge" hidden></span></summary>
      <div class="toolbar-row" id="filterRow">
        <label class="toolbar-label" for="searchInput">Search</label>
        <input type="search" id="searchInput" class="search-input" placeholder="Filter statements…">
        <label class="toolbar-label" for="filterSource">Feature filters use</label>
        <select id="filterSource" class="search-input compact-select">
          <option value="generator">Generator</option>
          <option value="judge">Judge</option>
        </select>
        <label class="toolbar-label" for="agreementFilter">Agreement</label>
        <select id="agreementFilter" class="search-input compact-select">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
        <label class="toolbar-label" for="commonsenseFilter">Common sense</label>
        <select id="commonsenseFilter" class="search-input compact-select">
          <option value="all">All</option>
          <option value="1">Judge: Yes</option>
          <option value="0">Judge: No</option>
          <option value="pending">Pending</option>
        </select>
        <span id="countLabel" class="count-label"></span>
      </div>
    </details>
  </div>

  <main class="content">
    <p id="tableCaption" class="table-caption"></p>
    <section id="summaryPanel" class="summary-panel" hidden></section>
    <div id="tablePanel" class="table-wrap">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="stmtBody"><tr class="empty-row"><td colspan="9">Loading…</td></tr></tbody>
      </table>
    </div>
    <div id="paginationBar" class="pagination-bar">
      <button id="btnPrev" class="page-btn" disabled aria-label="Previous page">&#8249;</button>
      <span id="pageInfo"></span>
      <button id="btnNext" class="page-btn" disabled aria-label="Next page">&#8250;</button>
    </div>
  </main>
  </div>

  <dialog id="statementDialog" aria-labelledby="statementDialogTitle">
    <div class="dialog-header">
      <h2 id="statementDialogTitle">Statement details</h2>
      <button id="closeStatement" class="page-btn" type="button" autofocus>Close</button>
    </div>
    <p id="statementText"></p>
    <p id="statementModel"></p>
    <section class="statement-feature">
      <h3>Human common sense</h3>
      <div id="statementCommonsense"></div>
    </section>
    <div id="statementFeatures"></div>
  </dialog>

  <div id="featPopup" role="tooltip"></div>
  <div id="dotTooltip" role="tooltip">
    <div class="dt-header"><span class="dt-label" id="dtLabel"></span><span class="dt-confidence" id="dtConfidence"></span></div>
    <div class="dt-explanation" id="dtExplanation"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
