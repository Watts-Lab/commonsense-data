# Prompt templates use $placeholders substituted by generate.py.
template: |
  Help me propose $num_statements statements that are examples of human common sense. Each statement must be short, of at most 15 words, and must satisfy all of the following six features:

  $features

  Your response must be a JSON object with a single key called "statements". This key must map to an array of $num_statements objects, each for a statement.

  In each statement object, there must be two keys:
  - "statement", which maps to a string for the statement;
  - "commonsense", which maps to a string that explains why the statement is an example of human common sense;
  - "features", which maps to an object which details why the statement satisfies each of the features. Each key, which is the name of a feature, maps to an object with two keys:
      - "explanation", which maps to a string that explains why the statement satisfies this feature;
      - "confidence", which maps to an integer between 1 and 4 that describes how confident you are that your statement satisfies this feature, where
        - 1 = very unconfident
        - 2 = somewhat unconfident
        - 3 = somewhat confident
        - 4 = very confident.
  
  Follow these instructions carefully:
  - Try your best to find statements that satisfy all features.
  - Make sure that these statements are good examples of human common sense.
  - Be honest about your confidence scores, even when you can only find statements that confidently satisfy some features but not others.
  - You must generate exactly $num_statements. Do not generate more or fewer statements.
  - Each of your explanation must be short, of at most 2 sentences. It must explain why you think the statement satisfies the feature, how confident you are in that judgment, and why the statement does not satisfy the opposite of the feature.
  - Make sure the $num_statements you generate have diverse content.
  - Output a valid JSON string following the above instructions and nothing else.
feature_template: |
  $number. $name: $definition For example:
  $examples
  (Note: This feature is in contrast to $opposite: $opposite_definition)
example_template: '- $example'
statement_example: The statement.
explanation_template: Why this statement is an example of $feature.
feature_definitions:
  fact/opinion:
    fact:
      value: 1
      definition: It is something that can be demonstrated to be correct or incorrect, independently of
        anyone's opinion.
      examples:
      - The earth is the third planet from the sun. (This is true.)
      - Obama was the 24th president of the United States. (This is false.)
    opinion:
      value: 0
      definition: It is something that someone might think is true, or wants others to think is true,
        but can't be demonstrated to be objectively correct or incorrect. That is, it is inherently subjective.
      examples:
      - FDR was the greatest US president of the 20th Century.
      - The Brooklyn Bridge is prettier than the Golden Gate.
      - It will be sunny next Tuesday.
  physical/social:
    physical:
      value: 1
      definition: It refers to objective features of the world as described by, say, physics, biology,
        engineering, mathematics or other natural rules. It can be measured empirically, or derived logically.
      examples:
      - Men on average are taller than women.
      - Ants are smaller than elephants.
    social:
      value: 0
      definition: It refers to beliefs, perceptions, preferences, and socially constructed rules that
        govern human experience. It can be "real" or opinion, but is intrinsically of human origins.
      examples:
      - I exist and am the same person I was yesterday.
      - There are seven days in the week.
  literal language/figure of speech:
    literal language:
      value: 1
      definition: It is plain and ordinary language that means exactly what it says.
      examples:
      - The sky is blue.
      - Elephants are larger than dogs.
    figure of speech:
      value: 0
      definition: It contains an aphorism, metaphor, hyperbole, etc.
      examples:
      - Birds of a feather flock together.
      - A friend to all is a friend to none.
  positive/normative:
    positive:
      value: 1
      definition: It refers to something in the world such as an empirical regularity or scientific law.
      examples:
      - Hot things will burn you.
      - The sun rises in the east and sets in the west.
    normative:
      value: 0
      definition: It refers to a judgment, belief, value, social norm or convention.
      examples:
      - If you are going to the office, you should wear business attire, not a bathing suit.
      - Freedom is a fundamental human right.
  knowledge/reasoning:
    knowledge:
      value: 1
      definition: It refers to some observation about the world; it may be true or false, opinion or fact,
        subjective or objective.
      examples:
      - Dogs are nicer than cats.
      - Glasses break when they are dropped.
    reasoning:
      value: 0
      definition: It presents a conclusion that is arrived at by combining knowledge and logic.
      examples:
      - My dog is wagging its tail, therefore it is happy.
      - The glass fell off the table, therefore it will break and the floor will become wet.
  everyday/abstract:
    everyday:
      value: 1
      definition: It is about something people encounter, or could encounter, situations like this in
        the course of their ordinary, everyday experiences.
      examples:
      - Commuting at rush hour takes longer.
      - Touching a hot stove will burn you.
    abstract:
      value: 0
      definition: It refers to regularities or conclusions that cannot be observed or arrived at solely
        through individual experience.
      examples:
      - Strict gun laws save lives.
      - Capitalism is a better economic system than Communism.

# The selected feature names are filled in per design point.
response_format:
  type: json_schema
  json_schema:
    name: statement-generation
    strict: true
    schema:
      type: object
      additionalProperties: false
      properties:
        statements:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              statement:
                type: string
                description: "The statement"
              commonsense:
                type: string
                description: "An explanation of why this statement is an example of human common sense."
              features:
                type: object
                additionalProperties: false
                properties: {}
                required: []
            required:
            - statement
            - commonsense
            - features
      required:
      - statements
feature_schema:
  type: object
  additionalProperties: false
  properties:
    explanation:
      type: string
      description: "An explanation of why this statement satisfies this property, how confident you are, and why it does not satisfy the opposite property. Maximum of 2 sentences."
    confidence:
      type: integer
      description: "Your confidence about whether this statement satisfies this property. Must be an integer between 1 and 4."
  required:
  - explanation
  - confidence
